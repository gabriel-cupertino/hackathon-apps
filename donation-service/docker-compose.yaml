services:
  donation-service:
    build: .
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://solidarytech_user:solidarytech_pass@postgres:5432/donation_db?sslmode=disable
      - AWS_SQS_URL=
      - AWS_REGION=us-east-1
      - PORT=8082
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=solidarytech_user
      - POSTGRES_PASSWORD=solidarytech_pass
      - POSTGRES_DB=donation_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidarytech_user -d donation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
