name: CI/CD - Donation Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "donation-service/**"
  pull_request:
    branches: [main]
    paths:
      - "donation-service/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: solidarytech_donation-service
  SERVICE_NAME: donation-service
  GITOPS_REPO: dougls/hackathon-gitops
  GITOPS_DEPLOYMENT_PATH: donation-service/deployment.yaml
  DB_INIT_SQL_PATH: donation-service/db/init.sql
  GITOPS_CONFIGMAP_PATH: donation-service/configmap.yaml
  CONFIGMAP_NAME: db-donation-service-init-sql
  K8S_NAMESPACE: donation-service

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Resolve Dependencies
        working-directory: donation-service
        run: go mod tidy

      - name: Build
        working-directory: donation-service
        run: go build ./...

      - name: Unit Tests
        working-directory: donation-service
        run: go test -v -race -coverprofile=coverage.out ./...

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Resolve Dependencies
        working-directory: donation-service
        run: go mod tidy

      - name: Pre-build
        working-directory: donation-service
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: donation-service

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: SCA - Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "donation-service"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          vuln-type: "os,library"

      - name: SAST - gosec
        uses: securego/gosec@master
        with:
          args: "-severity high -no-fail=false ./donation-service/..."

  docker-build-push:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: donation-service
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Container Scan - Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

      - name: Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  gitops-update:
    name: GitOps - Update Deployment & ConfigMap
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Deployment image tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*$ECR_REPOSITORY.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|" \
            gitops/$GITOPS_DEPLOYMENT_PATH

      - name: Sync init.sql to ConfigMap
        run: |
          cat > gitops/$GITOPS_CONFIGMAP_PATH << YAML_HEADER
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: $CONFIGMAP_NAME
            namespace: $K8S_NAMESPACE
            annotations:
              argocd.argoproj.io/hook: PreSync
              argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              argocd.argoproj.io/sync-wave: "-1"
          data:
            init.sql: |
          YAML_HEADER
          sed 's/^/    /' source/$DB_INIT_SQL_PATH >> gitops/$GITOPS_CONFIGMAP_PATH

      - name: Commit and Push changes
        run: |
          cd gitops
          git config user.name "GitHub Actions - GitOps"
          git config user.email "actions@github.com"
          git add $GITOPS_DEPLOYMENT_PATH $GITOPS_CONFIGMAP_PATH
          git diff --staged --quiet || git commit -m "GitOps: Update $SERVICE_NAME to ${{ github.sha }}"
          git push
