name: CI/CD - NGO Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ngo-service/**"
  pull_request:
    branches: [main]
    paths:
      - "ngo-service/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: solidarytech_ngo-service
  SERVICE_NAME: ngo-service
  GITOPS_REPO: gabriel-cupertino/hackathon-gitops
  GITOPS_DEPLOYMENT_PATH: ngo-service/deployment.yaml
  DB_INIT_SQL_PATH: ngo-service/db/init.sql
  GITOPS_CONFIGMAP_PATH: ngo-service/configmap.yaml
  CONFIGMAP_NAME: db-ngo-service-init-sql
  K8S_NAMESPACE: ngo-service

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ngo-service/requirements.txt

      - name: Install Dependencies
        working-directory: ngo-service
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit Tests
        working-directory: ngo-service
        run: pytest test_app.py -v --cov=app --cov-report=term-missing

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linters
        run: pip install flake8 pylint

      - name: flake8
        working-directory: ngo-service
        run: flake8 . --max-line-length=120 --exclude=__pycache__,.venv,requirements*.txt

      - name: pylint
        working-directory: ngo-service
        run: pylint **/*.py --fail-under=7.0 || true

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: SCA - Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "ngo-service"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          vuln-type: "os,library"

      - name: SAST - bandit
        run: |
          pip install bandit
          bandit -r ngo-service/ -ll -ii --exit-zero

  docker-build-push:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ngo-service
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Container Scan - Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  gitops-update:
    name: GitOps - Update Deployment & ConfigMap
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Deployment image tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*$ECR_REPOSITORY.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|" \
            gitops/$GITOPS_DEPLOYMENT_PATH

      - name: Sync init.sql to ConfigMap
        run: |
          cat > gitops/$GITOPS_CONFIGMAP_PATH << YAML_HEADER
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: $CONFIGMAP_NAME
            namespace: $K8S_NAMESPACE
            annotations:
              argocd.argoproj.io/hook: PreSync
              argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              argocd.argoproj.io/sync-wave: "-1"
          data:
            init.sql: |
          YAML_HEADER
          sed 's/^/    /' source/$DB_INIT_SQL_PATH >> gitops/$GITOPS_CONFIGMAP_PATH

      - name: Commit and Push changes
        run: |
          cd gitops
          git config user.name "GitHub Actions - GitOps"
          git config user.email "actions@github.com"
          git add $GITOPS_DEPLOYMENT_PATH $GITOPS_CONFIGMAP_PATH
          git diff --staged --quiet || git commit -m "GitOps: Update $SERVICE_NAME to ${{ github.sha }}"
          git push
